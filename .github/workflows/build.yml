                  var err by remember(key) { mutableStateOf<String?>(null) }

                  fun save() {
                      var h = host.trim().removePrefix("http://").removePrefix("https://").trimEnd('/')
                      var p = port.trim().toIntOrNull()
                      if (h.count { it == ':' } == 1) {
                          val parts = h.split(":")
                          h = parts[0]
                          if (p == null) p = parts[1].toIntOrNull()
                      }
                      if (h.isBlank()) {
                          err = "Bitte eine Server-Adresse eingeben"
                          return
                      }
                      val pp = p ?: 19132
                      if (pp < 1 || pp > 65535) {
                          err = "Port muss zwischen 1 und 65535 liegen"
                          return
                      }
                      Store.upsert(ctx, Srv(srv?.id ?: UUID.randomUUID().toString(), name.trim().ifBlank { h }, h, pp, srv?.fav ?: false))
                      close()
