          import java.net.URLEncoder
          import java.util.UUID

          data class Target(val name: String, val host: String, val port: Int)
          data class Stat(val name: String, val host: String, val port: Int, val avg: Double, val votes: Int)
          data class Review(val stars: Int, val comment: String, val date: String)

          fun starsTxt(avg: Double): String {
              val n = Math.round(avg).toInt().coerceIn(0, 5)
              return "★".repeat(n) + "☆".repeat(5 - n)
          }

          // ---------------------------------------------------------------- Konfiguration + API (Supabase)

          object Cfg {
              var url by mutableStateOf("")
              var key by mutableStateOf("")
              var device = ""
              val baked: Boolean get() = BuildConfig.SB_URL.isNotBlank() && BuildConfig.SB_KEY.isNotBlank()
              val ready: Boolean get() = url.isNotBlank() && key.isNotBlank()

              fun load(c: Context) {
                  val sp = c.getSharedPreferences("flamme", Context.MODE_PRIVATE)
                  url = if (baked) BuildConfig.SB_URL else (sp.getString("sb_url", "") ?: "")
                  key = if (baked) BuildConfig.SB_KEY else (sp.getString("sb_key", "") ?: "")
                  device = sp.getString("dev", null) ?: UUID.randomUUID().toString().also { sp.edit().putString("dev", it).apply() }
              }

              fun save(c: Context, u: String, k: String) {
                  c.getSharedPreferences("flamme", Context.MODE_PRIVATE).edit()
                      .putString("sb_url", u.trim()).putString("sb_key", k.trim()).apply()
                  url = u.trim()
                  key = k.trim()
              }
          }

          object Api {
              private fun req(method: String, path: String, body: String? = null): String {
                  val c = URL(Cfg.url.trim().trimEnd('/') + path).openConnection() as HttpURLConnection
                  try {
                      c.requestMethod = method
                      c.connectTimeout = 8000
                      c.readTimeout = 10000
                      c.setRequestProperty("apikey", Cfg.key)
                      if (Cfg.key.startsWith("eyJ")) c.setRequestProperty("Authorization", "Bearer " + Cfg.key)
                      c.setRequestProperty("Accept", "application/json")
                      if (body != null) {
                          c.doOutput = true
                          c.setRequestProperty("Content-Type", "application/json")
                          c.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
                      }
                      val code = c.responseCode
                      val st = if (code in 200..299) c.inputStream else c.errorStream
                      val txt = st?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) throw Exception("Server-Fehler " + code + ": " + txt.take(100))
                      return txt
                  } finally {
                      c.disconnect()
                  }
              }

              private fun enc(s: String): String = URLEncoder.encode(s, "UTF-8")

              private fun parseStats(txt: String): List<Stat> {
                  val a = JSONArray(txt)
                  val out = ArrayList<Stat>()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      out.add(Stat(o.optString("name", "?"), o.optString("host", ""), o.optInt("port", 19132), o.optDouble("avg_stars", 0.0), o.optInt("votes", 0)))
                  }
                  return out
              }

              fun stats(q: String): List<Stat> {
                  var path = "/rest/v1/server_stats?select=*&order=votes.desc,avg_stars.desc&limit=60"
                  val clean = q.replace(Regex("[,()*%&#]"), " ").trim()
                  if (clean.isNotEmpty()) {
                      val e = enc("*" + clean + "*")
                      path += "&or=(name.ilike." + e + ",host.ilike." + e + ")"
                  }
                  return parseStats(req("GET", path))
              }

              fun statOf(host: String, port: Int): Stat? {
                  val path = "/rest/v1/server_stats?select=*&host=eq." + enc(host.trim().lowercase()) + "&port=eq." + port
                  return parseStats(req("GET", path)).firstOrNull()
              }

              fun reviews(host: String, port: Int): List<Review> {
                  val path = "/rest/v1/ratings?select=stars,comment,updated_at&host=eq." + enc(host.trim().lowercase()) +
                      "&port=eq." + port + "&order=updated_at.desc&limit=40"
                  val a = JSONArray(req("GET", path))
                  val out = ArrayList<Review>()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      out.add(Review(o.optInt("stars", 0), o.optString("comment", ""), o.optString("updated_at", "").take(10)))
                  }
                  return out
              }

              fun rate(t: Target, stars: Int, comment: String) {
                  val b = JSONObject()
                      .put("p_host", t.host.trim().lowercase())
                      .put("p_port", t.port)
                      .put("p_name", t.name)
                      .put("p_stars", stars)
                      .put("p_comment", comment.trim())
                      .put("p_device", Cfg.device)
                  req("POST", "/rest/v1/rpc/rate_server", b.toString())
              }
          }

