# Flamme SMP – baut automatisch eine APK (Android-App, Liquid-Glass-Design)
# Nutzung: Diese Datei als  .github/workflows/build.yml  ins GitHub-Repository legen.
# Danach: Actions → "Flamme SMP APK" → Run workflow  (oder einfach pushen).
# Die fertige APK liegt danach unter "Artifacts" → FlammeSMP-APK.
name: Flamme SMP APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK Lizenzen (SDK ist auf dem Runner vorinstalliert)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projekt erzeugen (kompletter App-Code)
        run: |
          set -e
          mkdir -p flamme && cd flamme
          cat > settings.gradle.kts <<'FLAMME_EOF_1'
