# Flamme SMP – baut automatisch eine APK (Android-App, helles Liquid-Glass-Design)
# Nutzung: Diese Datei als  .github/workflows/build.yml  ins GitHub-Repository legen.
# Optional (für die Community-Bewertungen): im Repo unter Settings → Secrets and variables → Actions
#   zwei Secrets anlegen:  SUPABASE_URL  und  SUPABASE_KEY  (siehe supabase_setup.sql).
# Danach: Actions → "Flamme SMP APK" → Run workflow. Die APK liegt unter "Artifacts".
name: Flamme SMP APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK vorbereiten (Lizenzen + Pakete)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projekt erzeugen (kompletter App-Code)
        run: |
          set -e
          mkdir -p flamme && cd flamme
          cat > settings.gradle.kts <<'FLAMME_EOF_1'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FlammeSMP"
          include(":app")
          FLAMME_EOF_1
          cat > build.gradle.kts <<'FLAMME_EOF_2'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          FLAMME_EOF_2
          cat > gradle.properties <<'FLAMME_EOF_3'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          FLAMME_EOF_3
          mkdir -p app
          cat > app/build.gradle.kts <<'FLAMME_EOF_4'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val sbUrl = (System.getenv("SUPABASE_URL") ?: "").replace("\"", "").trim()
          val sbKey = (System.getenv("SUPABASE_KEY") ?: "").replace("\"", "").trim()

          android {
              namespace = "de.flamme.smp"
              compileSdk = 34

              defaultConfig {
                  applicationId = "de.flamme.smp"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
                  buildConfigField("String", "SB_URL", "\"" + sbUrl + "\"")
                  buildConfigField("String", "SB_KEY", "\"" + sbKey + "\"")
              }

              signingConfigs {
                  create("flamme") {
                      storeFile = file("flamme.jks")
                      storePassword = "flamme2026"
                      keyAlias = "flamme"
                      keyPassword = "flamme2026"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("flamme")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          FLAMME_EOF_4
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FLAMME_EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Flamme SMP"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Flamme">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
