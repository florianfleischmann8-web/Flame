                      ) {
                          if (!loading && items.isEmpty() && err == null) {
                              item {
                                  Column(Modifier.fillMaxWidth().glass().padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                      Txt("🔍", 36)
                                      Gap(6)
                                      Txt(if (q.isEmpty()) "Noch keine Bewertungen" else "Nichts gefunden", 16, Ink, FontWeight.Bold)
                                      Gap(4)
                                      Txt("Bewerte deinen Server im Tab „Server“ – dann erscheint er hier für alle.", 13, Ink.copy(alpha = 0.6f), align = TextAlign.Center)
                                  }
                              }
                          }
                          itemsIndexed(items, key = { _, s -> s.host + ":" + s.port }) { i, s ->
                              StatCard(s, i) { open(Target(s.name, s.host, s.port)) }
