          fun Modifier.glass(r: Dp = 28.dp, tint: Color = Color.White, a: Float = 0.10f): Modifier {
              val shape = RoundedCornerShape(r)
              val tinted = tint != Color.White
              return this
                  .shadow(6.dp, shape, ambientColor = Ember.copy(alpha = 0.25f), spotColor = Ember.copy(alpha = 0.35f))
                  .clip(shape)
                  .background(Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.80f), Color.White.copy(alpha = 0.44f))))
                  .background(if (tinted) Brush.verticalGradient(listOf(tint.copy(alpha = a + 0.10f), tint.copy(alpha = a))) else SolidColor(Color.Transparent))
                  .border(1.2.dp, Brush.linearGradient(listOf(Color.White.copy(alpha = 0.95f), Color.White.copy(alpha = 0.35f), Color.White.copy(alpha = 0.80f))), shape)
          }

          @Composable
          fun Modifier.bounce(onClick: () -> Unit): Modifier {
              val src = remember { MutableInteractionSource() }
              val pressed by src.collectIsPressedAsState()
              val sc by animateFloatAsState(if (pressed) 0.93f else 1f, spring(dampingRatio = 0.5f, stiffness = 500f), label = "bounce")
              return this.scale(sc).clickable(interactionSource = src, indication = null, onClick = onClick)
          }

          @Composable
          fun Modifier.appear(delayMs: Int = 0): Modifier {
              var go by remember { mutableStateOf(false) }
              LaunchedEffect(Unit) { go = true }
              val p by animateFloatAsState(if (go) 1f else 0f, tween(600, delayMs, FastOutSlowInEasing), label = "appear")
              return this.graphicsLayer {
                  alpha = p
                  translationY = (1f - p) * 70f
              }
          }

