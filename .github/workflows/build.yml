                          GField("KOMMENTAR (OPTIONAL)", comment, { comment = it.take(200) })
                          val m = msg
                          if (m != null) {
                              Txt(m, 13, Ink, FontWeight.SemiBold)
                              Gap(10)
                          }
                          Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                              if (t != null && Store.servers.none { it.host.equals(t.host, true) && it.port == t.port }) {
                                  GButton("+ Meine Server", Color(0xFF38BDF8), Modifier.weight(1f)) {
                                      Store.upsert(ctx, Srv(UUID.randomUUID().toString(), t.name, t.host, t.port))
                                      msg = "Server gespeichert ✓"
                                  }
                              }
                              GButton(if (busy) "Sende…" else "★ Bewerten", Ember, Modifier.weight(1f)) {
                                  if (t == null || busy) return@GButton
                                  if (!Cfg.ready) {
                                      msg = "Community ist noch nicht eingerichtet (Tab „Community“)."
                                      return@GButton
                                  }
                                  if (stars == 0) {
                                      msg = "Bitte zuerst Sterne wählen."
                                      return@GButton
                                  }
                                  busy = true
                                  scope.launch {
                                      try {
                                          withContext(Dispatchers.IO) { Api.rate(t, stars, comment) }
                                          msg = "Danke für deine Bewertung! ★"
                                          reload++
                                      } catch (e: CancellationException) {
                                          throw e
                                      } catch (e: Exception) {
                                          msg = "Senden fehlgeschlagen: " + (e.message ?: "Netzwerk")
                                      }
                                      busy = false
                                  }
                              }
                          }
                          if (revs.isNotEmpty()) {
                              Gap(18)
                              Txt("BEWERTUNGEN", 11, Ink.copy(alpha = 0.55f), FontWeight.Bold, ls = 1.5f)
                              Gap(8)
                              for (r in revs) {
                                  Column(Modifier.fillMaxWidth().glass(16.dp).padding(12.dp)) {
                                      Txt(starsTxt(r.stars.toDouble()) + "   " + r.date, 12, Gold, FontWeight.Bold)
                                      if (r.comment.isNotBlank()) {
                                          Gap(2)
                                          Txt(r.comment, 13, Ink)
                                      }
                                  }
                                  Gap(8)
                              }
                          }
                      }
                  }
              }
          }
          FLAMME_EOF_13
          mkdir -p tools
          cat > tools/make_icons.py <<'FLAMME_EOF_14'
          import os
          import struct
          import sys
          import zlib

          OUT = sys.argv[1] if len(sys.argv) > 1 else "."


          def lcg(seed):
              st = [seed]

              def nxt():
                  st[0] = (st[0] * 1103515245 + 12345) & 0x7FFFFFFF
                  return st[0] >> 8

              return nxt


          GREENS = [(94, 158, 60), (107, 174, 69), (121, 192, 90), (134, 204, 102)]
          DIRT = [(134, 96, 67), (122, 85, 56), (107, 74, 48), (149, 112, 79)]


          def tex_top():
              r = lcg(7)
              return [[GREENS[r() % 4] for _ in range(16)] for _ in range(16)]


          def tex_side():
              r = lcg(21)
              drip = [3 + (r() % 3) for _ in range(16)]
              t = []
              for y in range(16):
                  row = []
                  for x in range(16):
                      if y < drip[x]:
                          row.append(GREENS[r() % 3])
                      else:
                          v = r() % 12
                          if v == 0:
                              row.append((92, 63, 40))
                          elif v == 1:
                              row.append((160, 128, 94))
                          else:
                              row.append(DIRT[r() % 4])
                  t.append(row)
              return t


          def fire():
              tongues = [(1.5, 7), (4.5, 11), (7.5, 15), (10.5, 10), (13.5, 6)]
              H = []
              for x in range(16):
                  h = 2.0
                  for cx, ht in tongues:
                      h = max(h, ht - abs(x - cx) * 3.2)
                  H.append(int(h))
              grid = [[None] * 16 for _ in range(16)]
              for x in range(16):
                  near = min(abs(x - cx) for cx, _ in tongues)
                  for y in range(H[x]):
                      t = y / max(H[x], 1)
                      if near <= 0.6 and t < 0.30:
                          c = (255, 244, 170)
                      elif near <= 1.1 and t < 0.60:
                          c = (255, 201, 58)
                      elif t < 0.55:
                          c = (247, 130, 27)
                      elif t < 0.82:
                          c = (233, 90, 18)
                      else:
                          c = (205, 52, 12)
                      grid[15 - y][x] = c
              return grid


          def shade(c, f):
              return (int(c[0] * f), int(c[1] * f), int(c[2] * f))


          def render(S, fill):
              SS = 2
              N = S * SS
              top, left, right = tex_top(), tex_side(), tex_side()
              fr = fire()
              s = fill * N / 2.46
              cx0 = N / 2.0
              cy0 = N / 2.0 + 0.23 * s
              fc = 0.06 * s
              fx0 = cx0 - 8 * fc
              fy_bottom = cy0 - 0.5 * s + 0.05 * s
              fy0 = fy_bottom - 16 * fc
              y_min = int(cy0 - 1.5 * s)
              y_max = int(cy0 + 1.02 * s)
              eps = 1e-6
              hx = 0.8660254 * s
              hy = 0.5 * s
              big = [[None] * N for _ in range(N)]
              for py in range(max(0, y_min), min(N, y_max + 1)):
                  Yv = (py + 0.5 - cy0) / hy
                  row = big[py]
                  for px in range(N):
                      X = (px + 0.5 - cx0) / hx
                      col = None
                      # Flamme (vorne)
                      fcx = (px + 0.5 - fx0) / fc
                      fcy = (py + 0.5 - fy0) / fc
                      if 0 <= fcx < 16 and 0 <= fcy < 16:
                          col = fr[int(fcy)][int(fcx)]
                      if col is None:
                          x = (Yv + 2 + X) / 2
                          y = (Yv + 2 - X) / 2
                          if -eps <= x <= 1 + eps and -eps <= y <= 1 + eps:
                              col = shade(top[min(15, int(y * 16))][min(15, max(0, int(x * 16)))], 1.0)
                          else:
                              x = X + 1
                              z = (x + 1 - Yv) / 2
                              if -eps <= x <= 1 + eps and -eps <= z <= 1 + eps:
                                  col = shade(left[min(15, max(0, int((1 - z) * 16)))][min(15, max(0, int(x * 16)))], 0.80)
                              else:
                                  y = 1 - X
                                  z = (1 + y - Yv) / 2
                                  if -eps <= y <= 1 + eps and -eps <= z <= 1 + eps:
                                      col = shade(right[min(15, max(0, int((1 - z) * 16)))][min(15, max(0, int((1 - y) * 16)))], 0.60)
                      row[px] = col
              px_out = []
              for y in range(S):
                  for x in range(S):
                      r = g = b = a = 0
                      for dy in range(SS):
                          for dx in range(SS):
                              c = big[y * SS + dy][x * SS + dx]
                              if c is not None:
                                  r += c[0]
                                  g += c[1]
                                  b += c[2]
                                  a += 1
                      if a == 0:
                          px_out.append((0, 0, 0, 0))
                      else:
                          px_out.append((r // a, g // a, b // a, a * 255 // (SS * SS)))
              return px_out


          def write_png(path, S, px):
              raw = bytearray()
              for y in range(S):
                  raw.append(0)
                  for x in range(S):
                      raw.extend(px[y * S + x])

              def chunk(tag, data):
                  c = struct.pack(">I", len(data)) + tag + data
                  return c + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)

              png = b"\x89PNG\r\n\x1a\n"
              png += chunk(b"IHDR", struct.pack(">IIBBBBB", S, S, 8, 6, 0, 0, 0))
              png += chunk(b"IDAT", zlib.compress(bytes(raw), 9))
              png += chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)


          d = os.path.join(OUT, "app/src/main/res/drawable-nodpi")
          os.makedirs(d, exist_ok=True)
          write_png(os.path.join(d, "logo.png"), 384, render(384, 0.94))
          write_png(os.path.join(d, "ic_launcher_foreground.png"), 432, render(432, 0.62))
          print("Logo erzeugt")
          FLAMME_EOF_14
          echo '' | base64 -d > app/flamme.jks
          python3 tools/make_icons.py .

      - name: APK bauen
        working-directory: flamme
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain > ../build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Execution failed|AAPT|Could not|licen|Failed to" -A2 ../build.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle-Fehler::${msg}"
            echo "=========== LETZTE LOG-ZEILEN ==========="
            tail -n 60 ../build.log
          fi
          exit $rc

      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp flamme/app/build/outputs/apk/release/app-release.apk out/FlammeSMP.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FlammeSMP-APK
          path: out/FlammeSMP.apk
