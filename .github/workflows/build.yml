                              GField("ANON / PUBLISHABLE KEY", k, { k = it })
                              GButton("Speichern", Ember, Modifier.fillMaxWidth()) {
                                  if (u.isNotBlank() && k.isNotBlank()) {
                                      Cfg.save(ctx, u, k)
                                      tick++
                                  }
                              }
                          }
                      }
                  } else {
                      GField("SUCHE (NAME ODER IP)", q, { q = it })
                      val e = err
                      if (e != null) {
                          Column(Modifier.fillMaxWidth().glass(20.dp, Pink, 0.12f).padding(14.dp)) { Txt("⚠ " + e, 13, Ink) }
