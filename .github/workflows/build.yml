                          Txt("Handy-IP: " + Net.localIp(), 12, Color.White.copy(alpha = 0.5f))
                      }
                  }
                  val err = Live.error
                  if (err != null) {
                      Column(Modifier.padding(top = 12.dp).fillMaxWidth().glass(24.dp, Pink, 0.14f).padding(16.dp)) {
                          Txt("⚠ " + err, 13, Color.White)
                      }
                  }
                  Gap(20)
              }
          }

          // ---------------------------------------------------------------- Server

          @Composable
          fun Servers(openDlg: (Srv?) -> Unit) {
              var onlyFav by remember { mutableStateOf(false) }
              val list = Store.servers.filter { !onlyFav || it.fav }.sortedByDescending { it.fav }
              Column(Modifier.fillMaxSize().padding(horizontal = 20.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Txt("Meine Server", 26, Color.White, FontWeight.Black)
                          Txt(Store.servers.size.toString() + " gespeichert", 12, Color.White.copy(alpha = 0.55f))
                      }
                      Box(
                          Modifier.bounce { openDlg(null) }.size(54.dp).glass(27.dp, Ember, 0.25f),
                          contentAlignment = Alignment.Center
                      ) { Txt("+", 30, Color.White, FontWeight.Bold) }
                  }
                  Gap(14)
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Chip("Alle", false, !onlyFav) { onlyFav = false }
                      Chip("Favoriten", true, onlyFav) { onlyFav = true }
                  }
                  Gap(12)
                  LazyColumn(
                      Modifier.weight(1f).fillMaxWidth(),
                      verticalArrangement = Arrangement.spacedBy(12.dp),
                      contentPadding = PaddingValues(bottom = 16.dp)
                  ) {
                      if (list.isEmpty()) {
                          item {
                              Column(Modifier.appear(0).fillMaxWidth().glass().padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                  Txt("🔥", 40)
                                  Gap(8)
                                  Txt(if (onlyFav) "Noch keine Favoriten" else "Noch keine Server", 17, Color.White, FontWeight.Bold)
                                  Gap(4)
                                  Txt("Tippe oben rechts auf + und trage IP und Port ein.", 13, Color.White.copy(alpha = 0.6f), align = TextAlign.Center)
                              }
                          }
                      }
                      itemsIndexed(list, key = { _, s -> s.id }) { i, s ->
                          ServerCard(Modifier.animateItemPlacement(), s, i) { openDlg(s) }
                      }
                  }
              }
          }

          @Composable
          fun ServerCard(mod: Modifier, s: Srv, idx: Int, onEdit: () -> Unit) {
              val ctx = LocalContext.current
              val selected = s.id == Store.selected
              val bc by animateColorAsState(if (selected) Ember else Color.White.copy(alpha = 0.0f), tween(350), label = "cardborder")
              val star by animateFloatAsState(if (s.fav) 1.15f else 1f, spring(dampingRatio = 0.3f, stiffness = 400f), label = "star")
              val starCol by animateColorAsState(if (s.fav) Gold else Color.White.copy(alpha = 0.35f), tween(250), label = "starcol")
              Row(
                  mod.appear(idx * 70).bounce {
                      Store.selected = s.id
                      Store.save(ctx)
                  }.fillMaxWidth()
                      .glass(24.dp, if (selected) Ember else Color.White, if (selected) 0.14f else 0.08f)
                      .border(1.5.dp, bc, RoundedCornerShape(24.dp))
                      .padding(16.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier.bounce { Store.upsert(ctx, s.copy(fav = !s.fav)) }.size(40.dp).graphicsLayer { scaleX = star; scaleY = star },
                      contentAlignment = Alignment.Center
                  ) { Txt("★", 24, starCol) }
                  GapW(8)
                  Column(Modifier.weight(1f)) {
                      Txt(s.name, 17, Color.White, FontWeight.Bold, lines = 1)
                      Txt(s.host + ":" + s.port, 12, Color.White.copy(alpha = 0.55f), lines = 1)
                      if (selected) {
                          Gap(4)
                          Txt("● Ausgewählt", 11, Ember, FontWeight.Bold)
                      }
                  }
                  Box(
                      Modifier.bounce(onEdit).size(42.dp).glass(21.dp),
                      contentAlignment = Alignment.Center
                  ) { Txt("✎", 18) }
              }
          }

          @Composable
          fun GField(label: String, v: String, onChange: (String) -> Unit, kb: KeyboardType = KeyboardType.Text) {
              Column(Modifier.fillMaxWidth().padding(bottom = 12.dp)) {
                  Txt(label, 11, Color.White.copy(alpha = 0.55f), FontWeight.Bold, ls = 1.5f)
                  Gap(6)
                  Box(Modifier.fillMaxWidth().glass(16.dp, Color.White, 0.06f).padding(horizontal = 16.dp, vertical = 14.dp)) {
                      BasicTextField(
                          value = v,
                          onValueChange = onChange,
                          singleLine = true,
                          textStyle = TextStyle(color = Color.White, fontSize = 16.sp),
                          cursorBrush = SolidColor(Ember),
                          keyboardOptions = KeyboardOptions(keyboardType = kb),
                          modifier = Modifier.fillMaxWidth()
                      )
                  }
              }
          }

          @Composable
          fun GButton(text: String, tint: Color, mod: Modifier, onClick: () -> Unit) {
              Box(mod.bounce(onClick).glass(20.dp, tint, 0.30f).padding(vertical = 15.dp), contentAlignment = Alignment.Center) {
                  Txt(text, 15, Color.White, FontWeight.Bold)
              }
          }

          @Composable
          fun BoxScope.Sheet(open: Boolean, srv: Srv?, key: Int, close: () -> Unit) {
              val ctx = LocalContext.current
              AnimatedVisibility(open, enter = fadeIn(tween(250)), exit = fadeOut(tween(250))) {
                  Box(
                      Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.6f))
                          .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) { close() }
                  )
              }
              AnimatedVisibility(
                  open,
                  modifier = Modifier.align(Alignment.BottomCenter),
                  enter = slideInVertically(spring(dampingRatio = 0.8f, stiffness = 300f)) { it } + fadeIn(tween(200)),
                  exit = slideOutVertically(tween(250)) { it } + fadeOut(tween(200))
              ) {
                  var name by remember(key) { mutableStateOf(srv?.name ?: "") }
                  var host by remember(key) { mutableStateOf(srv?.host ?: "") }
                  var port by remember(key) { mutableStateOf(if (srv != null) srv.port.toString() else "19132") }
                  var err by remember(key) { mutableStateOf<String?>(null) }

                  fun save() {
                      var h = host.trim().removePrefix("http://").removePrefix("https://").trimEnd('/')
                      var p = port.trim().toIntOrNull()
                      if (h.count { it == ':' } == 1) {
                          val parts = h.split(":")
                          h = parts[0]
                          if (p == null) p = parts[1].toIntOrNull()
                      }
                      if (h.isBlank()) {
                          err = "Bitte eine Server-Adresse eingeben"
                          return
                      }
                      val pp = p ?: 19132
                      if (pp < 1 || pp > 65535) {
                          err = "Port muss zwischen 1 und 65535 liegen"
                          return
                      }
                      Store.upsert(ctx, Srv(srv?.id ?: UUID.randomUUID().toString(), name.trim().ifBlank { h }, h, pp, srv?.fav ?: false))
                      close()
                  }

                  Column(
                      Modifier.imePadding().navigationBarsPadding().padding(12.dp).fillMaxWidth()
                          .glass(36.dp, Color(0xFF2A1233), 0.55f).padding(22.dp)
                  ) {
                      Txt(if (srv == null) "Server hinzufügen" else "Server bearbeiten", 20, Color.White, FontWeight.Black)
                      Gap(16)
                      GField("NAME", name, { name = it })
                      GField("IP / DOMAIN", host, { host = it }, KeyboardType.Uri)
                      GField("PORT", port, { port = it.filter { c -> c.isDigit() }.take(5) }, KeyboardType.Number)
                      val e = err
                      if (e != null) {
                          Txt("⚠ " + e, 13, Pink)
                          Gap(10)
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          if (srv != null) {
                              GButton("Löschen", Pink, Modifier.weight(1f)) {
                                  Store.remove(ctx, srv.id)
                                  close()
                              }
                          }
                          GButton("Speichern", Ember, Modifier.weight(1f)) { save() }
                      }
                  }
              }
          }

          // ---------------------------------------------------------------- Info

          @Composable
          fun InfoCard(idx: Int, title: String, lines: List<String>) {
              Column(Modifier.appear(idx * 90).fillMaxWidth().glass().padding(18.dp)) {
                  Txt(title, 16, Color.White, FontWeight.Bold)
                  Gap(8)
                  for (l in lines) {
                      Txt(l, 13, Color.White.copy(alpha = 0.72f))
                      Gap(5)
                  }
              }
          }

          @Composable
          fun Info() {
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(horizontal = 20.dp)) {
                  Txt("Info", 26, Color.White, FontWeight.Black)
                  Gap(14)
                  InfoCard(
                      0, "So funktioniert's", listOf(
                          "1.  Handy und PS5 ins selbe WLAN.",
                          "2.  Server im Tab „Server“ anlegen und auswählen.",
                          "3.  Auf der Startseite die Flamme antippen.",
                          "4.  Minecraft → Spielen → Freunde → LAN-Spiele.",
                          "5.  Nach dem Beitritt läuft die Brücke im Hintergrund weiter – nicht beenden."
                      )
                  )
                  Gap(12)
                  InfoCard(
                      1, "Alle Versionen", listOf(
                          "Flamme SMP fragt den echten Server nach Version und Protokoll und gibt die Antwort unverändert an die Konsole weiter. So passt sich die Brücke automatisch an jede Bedrock-Version an – auch an neue Updates."
                      )
                  )
                  Gap(12)
                  InfoCard(
                      2, "⚡ Turbo-Modus", listOf(
                          "Aktiviert ein Low-Latency-WLAN-Lock, hohe Thread-Priorität, große Puffer und Low-Delay-Markierung der Pakete. Das reduziert lokalen Jitter. Deine Internetleitung und die Entfernung zum Server kann kein Programm schneller machen."
                      )
                  )
                  Gap(12)
                  InfoCard(
                      3, "Fehler „Terracotta“?", listOf(
                          "Terracotta ist ein Anmelde-Fehler von Minecraft selbst, kein Fehler dieser App.",
                          "•  In Minecraft ab- und wieder anmelden",
                          "•  PS5 komplett neu starten, Spiel updaten",
                          "•  PS-Plus aktiv? Anderes WLAN testen",
                          "•  Tritt er auch mit anderen LAN-Apps auf, liegt es am Spiel-Update."
                      )
                  )
                  Gap(18)
                  Txt("Flamme SMP · Version 1.0", 12, Color.White.copy(alpha = 0.4f), align = TextAlign.Center, mod = Modifier.fillMaxWidth())
                  Gap(20)
              }
          }
          FLAMME_EOF_13
          # Fester Signatur-Schlüssel (damit Updates über die alte App installiert werden können)
          echo '' | base64 -d > app/flamme.jks

      - name: APK bauen
        working-directory: flamme
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp flamme/app/build/outputs/apk/release/app-release.apk out/FlammeSMP.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FlammeSMP-APK
          path: out/FlammeSMP.apk
